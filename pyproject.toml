[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parse-freetext"
version = "1.1.0"
description = "Parse free-text records locally with Ollama and helper tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
spreadsheet-helper = "parse_freetext.cli:main"
parse-freetext-ollama = "parse_freetext.ollama_parser:main"

[tool.setuptools.packages.find]
where = ["src"]
